<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>AGDB Console</title>
<style>
:root{--bg:#08111f;--surface:#101c2d;--surface-raised:#16253b;--border:#28415f;--text:#edf5ff;--muted:#9db2ca;--blue:#49a3ff;--blue-strong:#2385ed;--green:#43d6a1;--amber:#f5bd56;--red:#ff707f;--shadow:0 18px 55px rgba(0,0,0,.28);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:var(--bg)}
*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{background:radial-gradient(circle at 15% -10%,#1a497d 0,transparent 35rem),radial-gradient(circle at 85% 5%,#25305e 0,transparent 31rem),var(--bg);font-size:16px}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.56}a{color:inherit;text-decoration:none}pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.public-header{height:72px;display:flex;align-items:center;justify-content:space-between;gap:20px;max-width:1180px;padding:0 28px;margin:auto}.brand{display:flex;align-items:center;gap:10px;font-weight:760;letter-spacing:-.03em;font-size:20px}.brand-mark{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#52b6ff,#5969eb);box-shadow:0 8px 20px rgba(73,163,255,.34)}.brand-mark svg{width:20px;height:20px}.public-nav,.header-actions{display:flex;align-items:center;gap:10px}.public-nav a{color:var(--muted);padding:8px 10px;font-size:14px}.public-nav a:hover{color:var(--text)}
.button{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:10px;padding:10px 14px;color:var(--text);font-weight:650;line-height:1.2;transition:background .16s,border-color .16s,transform .16s}.button:hover{transform:translateY(-1px)}.button svg{width:17px;height:17px}.button-primary{background:var(--blue-strong);box-shadow:0 8px 20px rgba(35,133,237,.26)}.button-primary:hover{background:#3694f4}.button-secondary{background:rgba(255,255,255,.04);border-color:var(--border)}.button-secondary:hover{background:rgba(255,255,255,.08);border-color:#42678f}.button-danger{background:rgba(255,112,127,.1);border-color:rgba(255,112,127,.4);color:#ffc5cc}.button-small{padding:7px 10px;border-radius:8px;font-size:13px}.button-icon{padding:8px;width:36px;height:36px}
.hero{max-width:1020px;margin:0 auto;padding:105px 28px 86px;text-align:center}.eyebrow{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border:1px solid rgba(73,163,255,.34);background:rgba(73,163,255,.08);border-radius:999px;color:#c7e4ff;font-size:13px;font-weight:650}.hero h1{max-width:760px;margin:24px auto 18px;font-size:clamp(39px,7vw,74px);line-height:1.01;letter-spacing:-.065em}.hero p{max-width:680px;margin:0 auto;color:var(--muted);font-size:clamp(17px,2vw,20px);line-height:1.6}.hero-actions{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin-top:32px}.landing-grid{max-width:1120px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:0 28px 88px;margin:auto}.landing-card{padding:24px;border:1px solid var(--border);border-radius:16px;background:linear-gradient(145deg,rgba(20,37,60,.93),rgba(12,24,40,.87));box-shadow:var(--shadow)}.landing-card svg{width:24px;height:24px;color:var(--blue)}.landing-card h2{font-size:17px;margin:19px 0 8px}.landing-card p{margin:0;color:var(--muted);line-height:1.55;font-size:14px}
.auth-wrap{display:grid;min-height:100vh;place-items:center;padding:26px}.auth-card{width:min(460px,100%);padding:32px;border:1px solid var(--border);border-radius:20px;background:linear-gradient(145deg,rgba(20,37,60,.96),rgba(11,21,35,.96));box-shadow:var(--shadow)}.auth-card .brand{margin-bottom:34px}.auth-card h1{font-size:29px;letter-spacing:-.045em;margin:0 0 9px}.auth-card>p{color:var(--muted);line-height:1.55;margin:0 0 25px}.field{display:grid;gap:7px;margin:0 0 17px}.field label{font-size:14px;font-weight:650}.field input,.field textarea,.field select{width:100%;color:var(--text);background:#0a1626;border:1px solid var(--border);border-radius:10px;padding:11px 12px;outline:none;transition:border-color .16s,box-shadow .16s}.field textarea{min-height:128px;resize:vertical;line-height:1.5}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(73,163,255,.17)}.help{color:var(--muted);font-size:13px;line-height:1.45}.form-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:22px}.auth-footer{margin:24px 0 0;text-align:center;color:var(--muted);font-size:14px}.auth-footer a{color:#acd7ff}.notice{display:flex;gap:10px;padding:13px 14px;margin:17px 0;border-radius:11px;border:1px solid rgba(73,163,255,.26);background:rgba(73,163,255,.08);color:#c7e4ff;font-size:14px;line-height:1.45}.notice.warning{border-color:rgba(245,189,86,.36);background:rgba(245,189,86,.1);color:#ffe0a2}.notice.danger{border-color:rgba(255,112,127,.36);background:rgba(255,112,127,.1);color:#ffc5cc}.notice svg{width:18px;height:18px;flex:none;margin-top:1px}
.console{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}.sidebar{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:20px 14px;border-right:1px solid var(--border);background:rgba(8,17,31,.88);backdrop-filter:blur(18px)}.sidebar .brand{padding:0 9px 24px}.side-nav{display:grid;gap:4px}.nav-link{display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:9px;color:var(--muted);font-size:14px;font-weight:600}.nav-link svg{width:18px;height:18px}.nav-link:hover{color:var(--text);background:rgba(255,255,255,.05)}.nav-link.active{background:rgba(73,163,255,.14);color:#cce8ff;border:1px solid rgba(73,163,255,.27)}.sidebar-footer{margin-top:auto;padding:16px 8px 0;color:var(--muted);font-size:12px}.main-shell{min-width:0}.topbar{height:72px;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:0 30px;border-bottom:1px solid rgba(40,65,95,.72);background:rgba(8,17,31,.52);backdrop-filter:blur(14px)}.identity{min-width:0;display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}.identity-dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(67,214,161,.12);flex:none}.identity-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.page{max-width:1320px;padding:34px 30px 56px;margin:auto}.page-header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:26px}.page-header h1{margin:0;font-size:31px;letter-spacing:-.05em}.page-header p{margin:7px 0 0;color:var(--muted);line-height:1.5}.page-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}.card{background:linear-gradient(145deg,rgba(20,37,60,.94),rgba(11,22,37,.92));border:1px solid var(--border);border-radius:15px;box-shadow:var(--shadow)}.card-pad{padding:21px}.metric-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px}.metric{padding:19px}.metric-label{color:var(--muted);font-size:13px;font-weight:650}.metric-value{margin-top:10px;font-size:30px;font-weight:760;letter-spacing:-.05em}.metric-detail{min-height:19px;margin-top:7px;color:var(--muted);font-size:13px}.two-column{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(280px,1fr);gap:16px}.section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.section-title h2{margin:0;font-size:16px;letter-spacing:-.015em}.section-title span{font-size:13px;color:var(--muted)}.chart{height:175px;display:flex;align-items:flex-end;gap:4px;padding-top:18px;border-bottom:1px solid rgba(157,178,202,.22)}.bar-wrap{height:100%;flex:1;display:flex;align-items:flex-end;min-width:3px}.bar{width:100%;min-height:1px;border-radius:4px 4px 0 0;background:linear-gradient(180deg,#70b8ff,#2584e9);opacity:.9}.chart-labels{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;padding-top:9px}.kv-list{display:grid}.kv{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid rgba(157,178,202,.13);font-size:14px}.kv:last-child{border:0}.kv span:first-child{color:var(--muted)}.kv span:last-child{text-align:right;overflow-wrap:anywhere}.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 8px;font-size:12px;font-weight:700;line-height:1}.badge.green{background:rgba(67,214,161,.12);color:#9cf2cf}.badge.blue{background:rgba(73,163,255,.13);color:#bde0ff}.badge.amber{background:rgba(245,189,86,.14);color:#ffe0a2}.badge.red{background:rgba(255,112,127,.13);color:#ffc5cc}.badge.gray{background:rgba(157,178,202,.12);color:#d6e1ed}.status-line{display:flex;align-items:center;gap:10px;padding:12px 0;color:var(--muted);font-size:14px}.status-line strong{color:var(--text)}.status-line svg{width:19px;height:19px;color:var(--blue)}
.toolbar{display:flex;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:16px}.toolbar .field{margin:0;flex:1;min-width:210px}.table-wrap{overflow:auto}.data-table{width:100%;border-collapse:collapse;font-size:14px}.data-table th{padding:11px 12px;text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.065em;color:var(--muted);border-bottom:1px solid var(--border)}.data-table td{padding:13px 12px;vertical-align:top;border-bottom:1px solid rgba(157,178,202,.13)}.data-table tr:last-child td{border:0}.data-table code{color:#cde7ff;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}.record-body{max-width:560px;white-space:pre-wrap;overflow-wrap:anywhere;color:#dfeeff;line-height:1.45}.tags{display:flex;gap:5px;flex-wrap:wrap}.tag{font-size:11px;border:1px solid rgba(73,163,255,.25);padding:3px 6px;border-radius:999px;color:#bddfff;background:rgba(73,163,255,.08)}.empty{display:grid;place-items:center;gap:9px;min-height:220px;padding:28px;text-align:center;color:var(--muted)}.empty svg{width:30px;height:30px;color:var(--blue)}.empty strong{color:var(--text)}.loading{display:flex;align-items:center;justify-content:center;gap:10px;min-height:210px;color:var(--muted)}.spinner{width:19px;height:19px;border:2px solid rgba(157,178,202,.3);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.code-output{max-height:500px;overflow:auto;padding:15px;border:1px solid rgba(157,178,202,.18);border-radius:10px;background:#07111e;color:#cbe6ff;font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace}.result-meta{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:15px 0;color:var(--muted);font-size:13px}.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.analytics-table td,.analytics-table th{white-space:nowrap}.progress{height:7px;border-radius:999px;background:rgba(157,178,202,.14);overflow:hidden;min-width:100px}.progress>span{display:block;height:100%;background:linear-gradient(90deg,#50b2ff,#535fe5);border-radius:inherit}.audit-list{display:grid}.audit-event{display:grid;grid-template-columns:145px 1fr auto auto;gap:16px;align-items:center;padding:13px 0;border-bottom:1px solid rgba(157,178,202,.13);font-size:14px}.audit-event:last-child{border:0}.audit-path{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#cde7ff;overflow-wrap:anywhere}.audit-time{color:var(--muted);font-size:12px}.danger-zone{border-color:rgba(255,112,127,.36)}
.modal-root{position:fixed;inset:0;display:none;place-items:center;padding:20px;background:rgba(2,7,14,.73);backdrop-filter:blur(6px);z-index:20}.modal-root.open{display:grid}.modal{width:min(570px,100%);max-height:90vh;overflow:auto;padding:24px;border:1px solid #42678f;border-radius:16px;background:#102038;box-shadow:0 24px 80px rgba(0,0,0,.45)}.modal h2{margin:0 0 10px;font-size:22px}.modal p{color:var(--muted);line-height:1.5}.secret{padding:13px;margin:18px 0;overflow-wrap:anywhere;border:1px solid rgba(245,189,86,.42);border-radius:10px;background:#07111e;color:#ffe0a2;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}.modal-actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin-top:20px}.toast-root{position:fixed;right:20px;bottom:20px;z-index:30;display:grid;gap:10px;width:min(390px,calc(100vw - 40px))}.toast{display:flex;gap:10px;align-items:flex-start;padding:13px 14px;border:1px solid var(--border);border-radius:11px;background:#13233a;box-shadow:var(--shadow);font-size:14px;line-height:1.4}.toast.success{border-color:rgba(67,214,161,.48)}.toast.error{border-color:rgba(255,112,127,.52)}.toast svg{width:18px;height:18px;flex:none}.toast.success svg{color:var(--green)}.toast.error svg{color:var(--red)}
@media(max-width:960px){.console{grid-template-columns:1fr}.sidebar{position:static;height:auto;display:block;padding:13px 18px;border-right:0;border-bottom:1px solid var(--border)}.sidebar .brand{padding:0 0 12px}.side-nav{display:flex;overflow:auto;padding-bottom:2px}.nav-link{white-space:nowrap}.sidebar-footer{display:none}.metric-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.landing-grid{grid-template-columns:1fr 1fr}.topbar{padding:0 20px}.page{padding:28px 20px 45px}}@media(max-width:640px){.public-header{padding:0 18px}.public-nav{display:none}.hero{padding:72px 20px 56px}.landing-grid{grid-template-columns:1fr;padding:0 20px 55px}.metric-grid,.two-column,.split{grid-template-columns:1fr}.page-header{display:block}.page-actions{justify-content:flex-start;margin-top:16px}.topbar{height:63px}.identity-text{max-width:150px}.page{padding:23px 15px 40px}.page-header h1{font-size:27px}.metric-value{font-size:27px}.audit-event{grid-template-columns:1fr;gap:6px}.data-table th:nth-child(3),.data-table td:nth-child(3){display:none}.auth-card{padding:25px 20px}}
</style>

<body>
<div id="app"></div>
<div id="modal-root" class="modal-root" role="dialog" aria-modal="true"></div>
<div id="toast-root" class="toast-root" aria-live="polite"></div>
<script>
"use strict";

const API_BASE = "/v1";
const session = { apiKey: "" };
let identity = null;
let renderEpoch = 0;

const icons = {
  logo: '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 2.5 3.5 7v10L12 21.5l8.5-4.5V7L12 2.5Z" stroke="currentColor" stroke-width="1.8"/><path d="m3.5 7 8.5 4.7L20.5 7M12 11.7v9.8" stroke="currentColor" stroke-width="1.8"/></svg>',
  dashboard: '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.8"/><rect x="14" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.8"/><rect x="3" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.8"/><rect x="14" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.8"/></svg>',
  database: '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><ellipse cx="12" cy="5" rx="8" ry="3" stroke="currentColor" stroke-width="1.8"/><path d="M4 5v7c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12v7c0 1.7 3.6 3 8 3s8-1.3 8-3v-7" stroke="currentColor" stroke-width="1.8"/></svg>',
  search: '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.5" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
  chart: '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 20V4M4 20h16M7 15l3-3 3 2 5-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  activity: '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 12h4l2.3-6 4.1 12 2.1-6H21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  server: '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="4" width="18" height="6" rx="2" stroke="currentColor" stroke-width="1.8"/><rect x="3" y="14" width="18" height="6" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M7 7h.01M7 17h.01" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/></svg>',
  key: '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="15.5" cy="8.5" r="4" stroke="currentColor" stroke-width="1.8"/><path d="m12.5 11.5-9 9M6 17l2 2M9 14l2 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
  tenant: '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 21h16M6 21V6l6-3 6 3v15M9 10h.01M9 14h.01M15 10h.01M15 14h.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
  audit: '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3 4.5 6v5c0 4.6 3.1 8 7.5 10 4.4-2 7.5-5.4 7.5-10V6L12 3Z" stroke="currentColor" stroke-width="1.8"/><path d="M8.5 12 11 14.5l4.8-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
  refresh: '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 11a8 8 0 1 0 1 4M20 4v7h-7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  play: '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m8 5 11 7-11 7V5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>',
  stop: '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1" stroke="currentColor" stroke-width="1.8"/></svg>',
  restart: '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M19 8V4l-3 3a8 8 0 1 0 2.3 8.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3m3 0-1 14H7L6 7m4 4v6m4-6v6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  copy: '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M15 9V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h4" stroke="currentColor" stroke-width="1.8"/></svg>',
  logout: '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M10 17 15 12 10 7M15 12H3M13 4h5a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  info: '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M12 11v5M12 8h.01" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m5 12 4.2 4.2L19 6.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  alert: '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3 2.8 20h18.4L12 3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 9v5M12 17h.01" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>'
};

const navItems = [
  ["dashboard", "Vezérlőpult", "dashboard"],
  ["data", "Rekordok", "database"],
  ["query", "Lekérdezés", "search"],
  ["stats", "Adatbázis statisztika", "chart"],
  ["analytics", "API analitika", "activity"],
  ["sandbox", "Sandbox", "server"],
  ["keys", "API kulcs", "key"],
  ["tenant", "Tenant", "tenant"],
  ["audit", "Audit napló", "audit"]
];

class ApiError extends Error {
  constructor(status, message, payload) {
    super(message);
    this.status = status;
    this.payload = payload;
  }
}

async function api(method, path, payload) {
  const headers = { "Accept": "application/json" };
  if (payload !== undefined) headers["Content-Type"] = "application/json";
  if (session.apiKey) headers.Authorization = "Bearer " + session.apiKey;
  let response;
  try {
    response = await fetch(API_BASE + path, {
      method,
      headers,
      body: payload === undefined ? undefined : JSON.stringify(payload),
      credentials: "same-origin"
    });
  } catch (error) {
    throw new ApiError(0, "A szerver nem érhető el.", null);
  }
  const raw = await response.text();
  let data = null;
  if (raw.length) {
    try {
      data = JSON.parse(raw);
    } catch (error) {
      throw new ApiError(response.status, "A szerver válasza nem érvényes JSON.", null);
    }
  }
  if (!response.ok) {
    const message = data && typeof data.error === "string" ? data.error : "A kérés sikertelen.";
    if (response.status === 401 && session.apiKey) clearSession(true);
    throw new ApiError(response.status, message, data);
  }
  return data;
}

function setSession(apiKey) {
  session.apiKey = apiKey;
}

function clearSession(redirect) {
  session.apiKey = "";
  identity = null;
  if (redirect) location.hash = "#/login";
}

function escapeHtml(value) {
  return String(value === null || value === undefined ? "" : value).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function number(value) {
  const numeric = Number(value);
  return Number.isFinite(numeric) ? new Intl.NumberFormat("hu-HU").format(numeric) : "—";
}

function fixed(value, digits) {
  const numeric = Number(value);
  return Number.isFinite(numeric) ? numeric.toLocaleString("hu-HU", { minimumFractionDigits: digits, maximumFractionDigits: digits }) : "—";
}

function timestamp(value) {
  if (value === null || value === undefined || value === "") return "—";
  const numeric = Number(value);
  if (!Number.isFinite(numeric)) return "—";
  const milliseconds = Math.abs(numeric) < 100000000000 ? numeric * 1000 : numeric;
  const date = new Date(milliseconds);
  return Number.isNaN(date.getTime()) ? "—" : new Intl.DateTimeFormat("hu-HU", { dateStyle: "medium", timeStyle: "medium" }).format(date);
}

function milliseconds(value) {
  const numeric = Number(value);
  return Number.isFinite(numeric) ? fixed(numeric, numeric < 10 ? 3 : 1) + " ms" : "—";
}

function titleText(route) {
  const item = navItems.find(entry => entry[0] === route);
  return item ? item[1] : "AGDB Console";
}

function button(label, kind, attributes) {
  return '<button class="button ' + kind + '" ' + (attributes || "") + '>' + label + '</button>';
}

function loading() {
  return '<div class="loading"><span class="spinner"></span><span>Adatok betöltése…</span></div>';
}

function empty(icon, title, description) {
  return '<div class="empty">' + icons[icon] + '<strong>' + escapeHtml(title) + '</strong><span>' + escapeHtml(description) + '</span></div>';
}

function toast(message, kind) {
  const root = document.getElementById("toast-root");
  if (!root) return;
  const item = document.createElement("div");
  item.className = "toast " + (kind === "error" ? "error" : "success");
  item.innerHTML = (kind === "error" ? icons.alert : icons.check) + '<span>' + escapeHtml(message) + '</span>';
  root.appendChild(item);
  window.setTimeout(() => item.remove(), 5000);
}

function showModal(title, content, actions) {
  const root = document.getElementById("modal-root");
  root.innerHTML = '<div class="modal"><h2>' + escapeHtml(title) + '</h2>' + content + '<div class="modal-actions">' + actions + '</div></div>';
  root.classList.add("open");
  root.addEventListener("click", event => {
    if (event.target === root) closeModal();
  }, { once: true });
}

function closeModal() {
  const root = document.getElementById("modal-root");
  root.classList.remove("open");
  root.innerHTML = "";
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    toast("A vágólapra másolva.", "success");
  } catch (error) {
    toast("A másolás nem sikerült.", "error");
  }
}

function downloadJson(value, filename) {
  const blob = new Blob([JSON.stringify(value, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const anchor = document.createElement("a");
  anchor.href = url;
  anchor.download = filename;
  document.body.appendChild(anchor);
  anchor.click();
  anchor.remove();
  URL.revokeObjectURL(url);
}

    ]);
    if (epoch !== renderEpoch) return;

    const maxRequests = Math.max(1, ...hourly.map(item => Number(item.requests) || 0));
    const bars = hourly.map(item => {
      const requests = Number(item.requests) || 0;
      const height = Math.max(requests ? 3 : 1, Math.round(requests / maxRequests * 100));
      return '<div class="bar-wrap" title="' + escapeHtml(timestamp(item.start_ms) + " · " + number(requests) + " kérés") + '"><span class="bar" style="height:' + height + '%"></span></div>';
    }).join("");
    const sandboxLabel = sandbox.status === "running" ? '<span class="badge green">Fut</span>' : '<span class="badge gray">Leállítva</span>';
    setPage(epoch, pageHeader("Vezérlőpult", "A tenant aktuális szerveroldali állapota és API-mérései.", button(icons.refresh + " Frissítés", "button-secondary", 'id="dashboard-refresh"')) + '<section class="metric-grid"><article class="card metric"><div class="metric-label">Összes rögzített API-kérés</div><div class="metric-value">' + number(analytics.total_requests) + '</div><div class="metric-detail">Szerveroldali számláló</div></article><article class="card metric"><div class="metric-label">Átlagos válaszidő</div><div class="metric-value">' + milliseconds(analytics.avg_latency_ms) + '</div><div class="metric-detail">p95: ' + milliseconds(analytics.p95_latency_ms) + '</div></article><article class="card metric"><div class="metric-label">Hibaarány</div><div class="metric-value">' + fixed(analytics.error_rate_percent, 2) + '%</div><div class="metric-detail">' + number(analytics.total_errors) + ' hibás válasz</div></article><article class="card metric"><div class="metric-label">Perzisztens rekordok</div><div class="metric-value">' + number(stats.records) + '</div><div class="metric-detail">Tároló: ' + number(stats.storage_bytes) + ' bájt</div></article></section><section class="two-column"><article class="card card-pad"><div class="section-title"><h2>API-kérések az elmúlt 24 órában</h2><span>' + escapeHtml(timestamp(analytics.period_start_ms)) + ' – ' + escapeHtml(timestamp(analytics.period_end_ms)) + '</span></div><div class="chart">' + bars + '</div><div class="chart-labels"><span>24 óra</span><span>jelenleg</span></div></article><article class="card card-pad"><div class="section-title"><h2>Sandbox</h2>' + sandboxLabel + '</div><div class="kv-list"><div class="kv"><span>Állapot</span><span>' + escapeHtml(sandbox.status || "—") + '</span></div><div class="kv"><span>Indítás</span><span>' + escapeHtml(timestamp(sandbox.started_at_ms)) + '</span></div><div class="kv"><span>Tenant</span><span><code>' + escapeHtml(tenant.tenant_id || "—") + '</code></span></div><div class="kv"><span>Adatbázis</span><span>' + escapeHtml(stats.database || "documents") + '</span></div></div></article></section>');
    const buttonElement = document.getElementById("dashboard-refresh");

  }

async function renderData(epoch, offset = 0) {
  setPage(epoch, pageHeader("Rekordok", "A documents adatbázisban perzisztensen tárolt rekordok.", button(icons.refresh + " Frissítés", "button-secondary", 'id="data-refresh"')) + '<section class="split"><article class="card card-pad"><div class="section-title"><h2>Új rekord</h2><span>POST /records</span></div><form id="record-form"><div class="field"><label for="record-body">Tartalom</label><textarea id="record-body" required></textarea></div><div class="field"><label for="record-tags">Címkék</label><input id="record-tags" type="text"><span class="help">Vesszővel elválasztott címkék.</span></div><button class="button button-primary" type="submit">' + icons.plus + ' Rekord mentése</button></form></article><article class="card card-pad"><div class="section-title"><h2>JSON import</h2><span>Több tényleges API-hívás</span></div><form id="import-form"><div class="field"><label for="import-json">Rekord vagy rekordok JSON-ban</label><textarea id="import-json" spellcheck="false"></textarea><span class="help">Minden objektum a POST /v1/databases/documents/records végpontra kerül.</span></div><button class="button button-secondary" type="submit">' + icons.database + ' Importálás</button></form></article></section><section class="card card-pad" style="margin-top:16px"><div id="records-content">' + loading() + '</div></section>');
  const refresh = document.getElementById("data-refresh");
  if (refresh) refresh.addEventListener("click", () => render());
  const recordForm = document.getElementById("record-form");
  recordForm.addEventListener("submit", async event => {
    event.preventDefault();
    const submit = recordForm.querySelector("button[type=submit]");
    const body = document.getElementById("record-body").value;
    const tags = document.getElementById("record-tags").value.split(",").map(value => value.trim()).filter(Boolean);
    submit.disabled = true;
    try {
      const response = await api("POST", "/databases/documents/records", { record: { body, tags } });
      toast("A rekord perzisztensen elmentve: " + response.id, "success");
      render();
    } catch (error) {
      toast(error.message || "A rekord mentése sikertelen.", "error");
      submit.disabled = false;
    }
  });
  const importForm = document.getElementById("import-form");
  importForm.addEventListener("submit", async event => {
    event.preventDefault();
    let parsed;
    try {
      parsed = JSON.parse(document.getElementById("import-json").value);
    } catch (error) {
      toast("Az import JSON nem érvényes.", "error");
      return;
    }
    const records = Array.isArray(parsed) ? parsed : [parsed];
    if (!records.length || records.some(record => !record || typeof record !== "object" || Array.isArray(record))) {
      toast("Az importnak objektumot vagy objektumok tömbjét kell tartalmaznia.", "error");
      return;
    }
    const submit = importForm.querySelector("button[type=submit]");
    submit.disabled = true;
    let succeeded = 0;
    const failures = [];
    for (const record of records) {
      try {
        await api("POST", "/databases/documents/records", { record });
        succeeded += 1;
      } catch (error) {
        failures.push(error.message || "ismeretlen hiba");
      }
    }
    if (failures.length) toast(succeeded + " rekord mentve, " + failures.length + " rekord hibás.", "error");
    else toast(succeeded + " rekord perzisztensen importálva.", "success");
    render();
  });
  try {
    const response = await api("GET", "/databases/documents/records?limit=100&offset=" + encodeURIComponent(offset));
    if (epoch !== renderEpoch) return;
    renderRecords(response, offset);
  } catch (error) {
    const target = document.getElementById("records-content");
    if (target) target.innerHTML = empty("alert", "A rekordok nem tölthetők be", error.message || "Ismeretlen hiba történt.");
  }
}

function renderRecords(response, offset) {
  const target = document.getElementById("records-content");
  if (!target) return;
  const rows = Array.isArray(response.rows) ? response.rows : [];
  const total = Number.isFinite(Number(response.total)) ? Number(response.total) : rows.length;
  const previousOffset = Math.max(0, offset - 100);
  const nextOffset = offset + rows.length;
  const previous = offset === 0 ? '<button class="button button-secondary button-small" disabled>Előző oldal</button>' : '<a class="button button-secondary button-small" href="#/data?offset=' + previousOffset + '">Előző oldal</a>';
  const next = nextOffset < total ? '<a class="button button-secondary button-small" href="#/data?offset=' + nextOffset + '">Következő oldal</a>' : '';
  const pagination = '<div class="form-actions">' + previous + next + '</div>';
  if (!rows.length) {
    const title = total === 0 ? "Nincs tárolt rekord" : "Nincs rekord ezen az oldalon";
    const description = total === 0 ? "A fenti űrlappal első perzisztens rekordját mentheti el." : "Válasszon egy korábbi oldalt a tárolt rekordok megtekintéséhez.";
    target.innerHTML = empty("database", title, description) + (offset > 0 ? pagination : "");
    return;
  }
  target.innerHTML = '<div class="section-title"><h2>Tárolt rekordok</h2><div class="form-actions"><span>' + number(total) + ' rekord · ' + milliseconds(response.took_ms) + '</span><button id="export-record-page" class="button button-secondary button-small">' + icons.copy + ' Oldal exportálása</button></div></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Azonosító</th><th>Tartalom</th><th>Címkék</th><th></th></tr></thead><tbody>' + rows.map(record => '<tr><td><code>' + escapeHtml(record.id) + '</code></td><td><div class="record-body">' + escapeHtml(record.body || "") + '</div></td><td><div class="tags">' + (Array.isArray(record.tags) ? record.tags.map(tag => '<span class="tag">' + escapeHtml(tag) + '</span>').join("") : "") + '</div></td><td><button class="button button-danger button-small" data-delete-record="' + escapeHtml(record.id) + '">' + icons.trash + '<span class="sr-only">Törlés</span></button></td></tr>').join("") + '</tbody></table></div>' + pagination;
  const exportButton = document.getElementById("export-record-page");
  if (exportButton) exportButton.addEventListener("click", () => {
    downloadJson(rows, "agdb-documents-offset-" + offset + ".json");
    toast("A betöltött rekordoldal exportálva.", "success");
  });
  target.querySelectorAll("[data-delete-record]").forEach(buttonElement => buttonElement.addEventListener("click", () => confirmDeleteRecord(buttonElement.getAttribute("data-delete-record"))));
}

    } catch (error) {
      toast(error.message || "A rekord törlése sikertelen.", "error");
      submit.disabled = false;
    }
  });
}

async function renderQuery(epoch) {
  setPage(epoch, pageHeader("Lekérdezés", "A keresés és a lista közvetlenül a documents adatbázis API-ját használja.") + '<section class="card card-pad"><form id="query-form"><div class="toolbar"><div class="field"><label for="query-text">Keresési kifejezés</label><input id="query-text" type="search" autocomplete="off"></div><div class="field" style="flex:0 0 145px"><label for="query-limit">Limit</label><input id="query-limit" type="number" min="1" max="1000" value="25"></div><button class="button button-primary" type="submit">' + icons.play + ' Futtatás</button></div></form><div id="query-result">' + empty("search", "Futtasson lekérdezést", "A válasz a szerveroldali keresőből érkezik.") + '</div></section>');
  const form = document.getElementById("query-form");
  form.addEventListener("submit", async event => {
    event.preventDefault();
    const result = document.getElementById("query-result");
    const submit = form.querySelector("button[type=submit]");
    const query = document.getElementById("query-text").value;
    const limit = Math.max(1, Math.min(1000, Number(document.getElementById("query-limit").value) || 25));
    submit.disabled = true;
    result.innerHTML = loading();
    try {
      const response = await api("POST", "/databases/documents/query", { query, limit });
      const rows = Array.isArray(response.rows) ? response.rows : [];
      result.innerHTML = '<div class="result-meta"><span class="badge blue">' + number(response.count) + ' találat</span><span>Összes elérhető rekord: ' + number(response.total) + '</span><span>Futási idő: ' + milliseconds(response.took_ms) + '</span></div>' + (rows.length ? '<pre class="code-output">' + escapeHtml(JSON.stringify(rows, null, 2)) + '</pre>' : empty("search", "Nincs találat", query ? "A keresési kifejezéshez nem található rekord." : "A tenant adatbázisa jelenleg üres."));
    } catch (error) {
      result.innerHTML = empty("alert", "A lekérdezés sikertelen", error.message || "Ismeretlen hiba történt.");

      submit.disabled = false;
    }
  });
}

ble></div></section><section class="card card-pad"><div class="section-title"><h2>Végpontok</h2><span>Útvonalanként aggregált tényleges hívások</span></div>' + (endpoints.length ? '<div class="table-wrap"><table class="data-table analytics-table"><thead><tr><th>Módszer</th><th>Útvonal</th><th>Kérés</th><th>Hiba</th><th>Átlag</th><th>Maximum</th></tr></thead><tbody>' + endpoints.map(item => '<tr><td><span class="badge blue">' + escapeHtml(item.method) + '</span></td><td><code>' + escapeHtml(item.path) + '</code></td><td>' + number(item.requests) + '</td><td>' + number(item.errors) + '</td><td>' + milliseconds(item.avg_latency_ms) + '</td><td>' + milliseconds(item.max_latency_ms) + '</td></tr>').join("") + '</tbody></table></div>' : empty("activity", "Még nincs rögzített végpontforgalom", "Az első hitelesített API-hívás után itt valós végpontmérések jelennek meg.")) + '</section>');

    const sandbox = await api("GET", "/sandbox");

    const refresh = document.getElementById("sandbox-refresh");
    if (refresh) refresh.addEventListener("click", () => render());
    const bindings = [["sandbox-start", "/sandbox/start", "Sandbox elindítva."], ["sandbox-stop", "/sandbox/stop", "Sandbox leállítva."], ["sandbox-restart", "/sandbox/restart", "Sandbox újraindítva."]];
    bindings.forEach(([id, path, message]) => {
      const control = document.getElementById(id);
      if (!control) return;

          await api("POST", path);
          toast(message, "success");

          toast(error.message || "A sandbox művelet sikertelen.", "error");
          control.disabled = false;
        }
      });

function confirmRotateKey() {
  showModal("Új API kulcs kiadása", '<p>A meglévő elsődleges kulcs érvénytelen lesz. Az új kulcsot azonnal el kell mentenie.</p>', '<button id="cancel-rotate-key" class="button button-secondary">Mégse</button><button id="confirm-rotate-key" class="button button-danger">' + icons.refresh + ' Kulcs kiadása</button>');
  document.getElementById("cancel-rotate-key").addEventListener("click", closeModal);
  document.getElementById("confirm-rotate-key").addEventListener("click", async () => {
    const action = document.getElementById("confirm-rotate-key");
    action.disabled = true;
    try {
      const response = await api("POST", "/apikeys");
      if (!response || typeof response.key !== "string" || !response.key) throw new ApiError(500, "A szerver nem adott ki új kulcsot.", response);
      setSession(response.key);
      showIssuedKey(response.key, "Új API kulcs kiadva", "A korábbi elsődleges kulcs érvénytelen. Másolja ki az új kulcsot.");
    } catch (error) {
      toast(error.message || "A kulcs kiadása sikertelen.", "error");
      action.disabled = false;
    }
  });
}

function confirmAccountDeletion() {
  showModal("Fiók törlése", '<p>Írja be pontosan: <strong>TÖRLÉS</strong></p><div class="field"><label for="delete-confirmation">Megerősítés</label><input id="delete-confirmation" type="text" autocomplete="off"></div>', '<button id="cancel-account-delete" class="button button-secondary">Mégse</button><button id="confirm-account-delete" class="button button-danger">' + icons.trash + ' Végleges törlés</button>');
  document.getElementById("cancel-account-delete").addEventListener("click", closeModal);
  document.getElementById("confirm-account-delete").addEventListener("click", async () => {
    if (document.getElementById("delete-confirmation").value !== "TÖRLÉS") {
      toast("A megerősítő szöveg nem egyezik.", "error");
      return;
    }
    const action = document.getElementById("confirm-account-delete");
    action.disabled = true;
    try {
      await api("DELETE", "/account");
      closeModal();
      clearSession(false);
      toast("A fiók törölve.", "success");
      location.hash = "#/";
    } catch (error) {
      toast(error.message || "A fiók törlése sikertelen.", "error");
      action.disabled = false;
    }
  });
}

function renderUnsupported(epoch, route) {
  setPage(epoch, pageHeader(titleText(route), "AGDB Console") + '<section class="card">' + empty("alert", "Ismeretlen oldal", "A kért konzololdal nem létezik.") + '</section>');
}

function hashOffset(query) {
  const parameters = new URLSearchParams(query);
  const value = Number(parameters.get("offset") || "0");
  if (!Number.isSafeInteger(value) || value < 0 || value > 1000000) return 0;
  return value;
}

function render() {
  const epoch = ++renderEpoch;
  const fragment = (location.hash || "#/").replace(/^#\/?/, "");
  const separator = fragment.indexOf("?");
  const route = (separator === -1 ? fragment : fragment.slice(0, separator)) || "home";
  const query = separator === -1 ? "" : fragment.slice(separator + 1);
  if (route === "home" || route === "/") {
    renderLanding();
    return;
  }
  if (route === "register") {
    renderRegister();
    return;
  }
  if (route === "login") {
    renderLogin();
    return;
  }
  if (!session.apiKey) {
    location.hash = "#/login";
    return;
  }
  renderConsole(route, epoch);
  const page = {
    dashboard: renderDashboard,
    data: renderData,
    query: renderQuery,
    stats: renderStats,
    analytics: renderAnalytics,
    sandbox: renderSandbox,
    keys: renderKeys,
    tenant: renderTenant,
    audit: renderAudit
  }[route];
  if (page) {
    if (route === "data") page(epoch, hashOffset(query));
    else page(epoch);
  } else renderUnsupported(epoch, route);
}

window.addEventListener("hashchange", render);
window.addEventListener("DOMContentLoaded", render);
render();
</script>
